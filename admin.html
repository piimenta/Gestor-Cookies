<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#043303">
  <meta name="robots" content="noindex, nofollow">
  <title>Painel · Cookies</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍪</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat+Brush&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/admin.js"></script>
</head>
<body>
  <header class="topo">
    <h1 class="titulo">Painel</h1>
    <svg class="rabisco" viewBox="0 0 180 14" aria-hidden="true"><path d="M3 8 Q 13 1 23 8 T 43 8 T 63 8 T 83 8 T 103 8 T 123 8 T 143 8 T 163 8 T 177 7"/></svg>
    <div class="topo-acoes" id="topo-acoes" hidden>
      <button type="button" class="pill" id="btn-atualizar">🔄 Atualizar</button>
      <a class="pill" href="qr.html" target="_blank" rel="noopener">🖨️ Cartaz</a>
      <button type="button" class="pill" id="btn-sair">Sair</button>
    </div>
  </header>

  <main>
    <div id="erro" class="banner banner-erro" role="alert" hidden><p id="erro-msg"></p></div>

    <!-- Login -->
    <section id="tela-pin" hidden>
      <form class="card" id="form-pin">
        <h2>Entrar</h2>
        <label for="pin">PIN</label>
        <input id="pin" class="campo" type="password" inputmode="numeric" autocomplete="current-password"
               pattern="[0-9]*" maxlength="12" required style="border-color:var(--linha);background:var(--suave)">
        <p></p>
        <button class="btn btn-bloco" id="btn-entrar">Entrar</button>
      </form>
    </section>

    <!-- Painel -->
    <section id="tela-painel" hidden>
      <div class="resumo">
        <div class="card">
          <p class="saldo-label">A receber</p>
          <p class="num" id="total-receber">—</p>
        </div>
        <div class="card">
          <p class="saldo-label">Recebido no mês</p>
          <p class="num" id="total-mes">—</p>
        </div>
      </div>

      <div class="card destaque" id="box-aguardando">
        <h2>Pagamentos para confirmar</h2>
        <div id="aguardando"></div>
      </div>

      <div class="card">
        <h2>Quem está devendo</h2>
        <div id="devedores"></div>
      </div>

      <div class="card">
        <h2>Clientes</h2>
        <form class="linha-form" id="form-cliente">
          <input id="novo-cliente" class="campo" placeholder="Nome do cliente novo" maxlength="40" autocomplete="off"
                 autocapitalize="words" aria-label="Nome do cliente novo" required>
          <button class="btn btn-sm" id="btn-add-cliente">➕ Adicionar</button>
        </form>
        <details id="box-clientes">
          <summary id="resumo-clientes">Todos os clientes</summary>
          <div id="clientes"></div>
        </details>
      </div>

      <div class="card">
        <h2>Limpeza</h2>
        <p class="dica">Apaga da planilha as compras <strong>canceladas</strong> e os pagamentos <strong>rejeitados</strong>. Não muda o saldo de ninguém.</p>
        <button type="button" class="btn btn-sm btn-perigo" data-acao="limpar-cancelados">🧹 Apagar cancelados e rejeitados</button>
      </div>
      <p class="dica" id="atualizado"></p>
    </section>
  </main>

  <!-- Histórico de uma pessoa -->
  <dialog id="dlg-hist">
    <div class="dlg-topo">
      <div>
        <h2 id="hist-nome" style="margin:0"></h2>
        <p class="item-sub" id="hist-saldo"></p>
      </div>
      <button type="button" class="dlg-fechar" data-fechar aria-label="Fechar">✕</button>
    </div>
    <div class="item-acoes" id="hist-acoes"></div>
    <div id="hist-corpo"><p class="vazio">Carregando…</p></div>
  </dialog>

  <!-- Pagamento em dinheiro -->
  <dialog id="dlg-dinheiro">
    <form id="form-dinheiro" method="dialog">
      <div class="dlg-topo">
        <h2 style="margin:0">Recebi em dinheiro</h2>
        <button type="button" class="dlg-fechar" data-fechar aria-label="Fechar">✕</button>
      </div>
      <p id="din-nome" class="item-sub"></p>
      <label for="din-valor">Valor (R$)</label>
      <input id="din-valor" class="campo" inputmode="decimal" autocomplete="off" required>
      <label for="din-obs">Observação</label>
      <input id="din-obs" class="campo" maxlength="100" placeholder="Dinheiro" autocomplete="off">
      <button class="btn btn-ok btn-bloco" id="din-salvar" value="salvar">Salvar pagamento</button>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
